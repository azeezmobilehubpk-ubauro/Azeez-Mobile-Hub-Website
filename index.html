
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azeez Mobile Hub</title>
<style>
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#000;border-bottom:2px solid #d4af37}
h1,h2{color:#d4af37}
section{margin:18px auto;padding:18px;max-width:600px}
.panel{background:#1c1c1c;border:1px solid #d4af37;border-radius:12px}
input,select,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:7px;font-size:16px}
input,select{background:#fff;color:#111;border:1px solid #aaa;pointer-events:auto}
button{background:#d4af37;color:#111;font-weight:bold;border:0;cursor:pointer}
.result{line-height:1.9;overflow-wrap:anywhere}
a{color:#d4af37}
</style>
</head>
<body>
<header>
<h1>AZEEZ MOBILE HUB</h1>
<p>Asaan Mahana Qiston Par Mobile</p>
</header>

<section class="panel">
<h2>Installment Calculator</h2>
<label for="cashPrice">Mobile Cash Price (Rs.)</label>
<input id="cashPrice" type="number" min="1" step="1" placeholder="Misal: 50000">

<label for="months">Qiston ki Muddat</label>
<select id="months">
<option value="3">3 Mahine</option>
<option value="6" selected>6 Mahine</option>
<option value="9">9 Mahine</option>
<option value="12">12 Mahine</option>
</select>

<button id="calculateButton" type="button">Qist Calculate Karein</button>
<div id="result" class="result" aria-live="polite"></div>
</section>

<section class="panel">
<h2>WhatsApp Par Rabta Karein</h2>
<p>Mobile ki qiston aur availability ke liye hum se rabta karein.</p>
<button id="whatsappButton" type="button">WhatsApp Karein</button>
</section>

<section class="panel">
<h2>Admin Login</h2>
<label for="admin-email">Admin Email</label>
<input id="admin-email" type="email" autocomplete="username" placeholder="Apni email likhein">

<label for="admin-password">Password</label>
<input id="admin-password" type="password" autocomplete="current-password" placeholder="Password likhein">

<button id="admin-login-button" type="button">Login</button>
<p id="admin-message" aria-live="polite"></p>
</section>

<script>
document.getElementById("calculateButton").addEventListener("click", function(){
  const price = Number(document.getElementById("cashPrice").value);
  const months = Number(document.getElementById("months").value);
  const result = document.getElementById("result");

  if (!Number.isFinite(price) || price <= 0) {
    result.textContent = "Meherbani karke sahi cash price likhein.";
    return;
  }

  const advance = Math.round(price * 0.30);
  const total = Math.round(price * (1 + 0.05 * months));
  const remaining = total - advance;
  const monthly = Math.round(remaining / months);

  result.innerHTML =
    "<b>Cash Price:</b> Rs. " + price.toLocaleString("en-PK") + "<br>" +
    "<b>30% Advance:</b> Rs. " + advance.toLocaleString("en-PK") + "<br>" +
    "<b>Total Installment Price:</b> Rs. " + total.toLocaleString("en-PK") + "<br>" +
    "<b>Monthly Qist (taqreeban):</b> Rs. " + monthly.toLocaleString("en-PK") +
    "<br><small>Aakhri qist mein rounding ka farq ho sakta hai.</small>";
});

document.getElementById("whatsappButton").addEventListener("click", function(){
  window.open("https://wa.me/923013432510", "_blank");
});
</script>

<script type="module" src="app.js"></script>
</body>
</html>
